<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar Público · Monitor de dinheiro público</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topo">
    <div class="marca"><span class="alvo"></span><b>Radar Público</b><small>monitor de dinheiro público · dados abertos</small></div>
    <nav id="abas">
      <button data-aba="alertas" class="on">Alertas</button>
      <button data-aba="risco">Risco financeiro</button>
      <button data-aba="fichas">Fichas</button>
      <button data-aba="exterior">Exterior</button>
      <button data-aba="justica">Judiciário</button>
      <button data-aba="noticias">Notícias</button>
      <button data-aba="sobre">Como ler</button>
    </nav>
    <div class="resumo" id="resumo"></div>
    <div class="ameaca" id="ameaca"></div>
  </header>

  <main>
    <aside id="painel">
      <section id="aba-alertas" class="aba on">
        <div class="rot">// alvos monitorados</div>
        <div class="filtros" id="filtros">
          <button data-g="todas" class="on">Todos</button>
          <button data-g="alta">Alta</button>
          <button data-g="media">Média</button>
          <button data-g="baixa">Baixa</button>
        </div>
        <ul id="itens"></ul>
      </section>
      <section id="aba-risco" class="aba"></section>
      <section id="aba-fichas" class="aba"></section>
      <section id="aba-exterior" class="aba"></section>
      <section id="aba-justica" class="aba"></section>
      <section id="aba-noticias" class="aba"></section>
      <section id="aba-sobre" class="aba"></section>
    </aside>

    <div id="mapa"></div>
    <div class="varre" id="varre"></div>
    <div class="scan"></div><div class="vinheta"></div>
    <i class="cb tl"></i><i class="cb tr"></i><i class="cb bl"></i><i class="cb br"></i>
    <div id="coords">LAT --.-- · LON --.--</div>
    <section id="detalhe" hidden></section>
    <div id="legenda">
      <span style="color:#ff2d55"><i style="background:#ff2d55"></i>Prioridade alta</span>
      <span style="color:#ffb300"><i style="background:#ffb300"></i>Média</span>
      <span style="color:#00b8ff"><i style="background:#00b8ff"></i>Baixa</span>
      <label class="tg"><input type="checkbox" id="tg-voos"> Voos internacionais pagos com a cota</label><span class="mudo">Clique num alerta para ver a rota do dinheiro</span>
    </div>
  </main>
  <script type="module" src="/main.js"></script>
</body>
</html>
