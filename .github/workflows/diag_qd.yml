name: Diagnóstico Querido Diário
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Testar endpoints
        run: |
          for u in "https://api.queridodiario.ok.org.br/gazettes?querystring=%22Banco+Master%22&size=2" "https://queridodiario.ok.org.br/api/gazettes?querystring=%22Banco+Master%22&size=2" "https://api.queridodiario.ok.org.br/" "https://api.queridodiario.ok.org.br/docs"; do
            echo "=== $u"; curl -sS -m 40 -o /tmp/r.txt -w "HTTP %{http_code} em %{time_total}s\n" "$u" || true; head -c 400 /tmp/r.txt; echo
          done
          echo "=== TLS"; curl -svI -m 30 https://api.queridodiario.ok.org.br/ 2>&1 | grep -iE "TLS|SSL|subject|issuer|HTTP/" | head -8
