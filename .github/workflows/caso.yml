name: Investigação - diários oficiais do caso
on:
  workflow_dispatch:
    inputs:
      caso:
        description: "Nome do caso (arquivo casos/<caso>_consultas.json)"
        default: "master"
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python ingestao/diarios_casos.py "${{ inputs.caso }}"
      - name: Salvar resultado no repositório
        run: |
          git config user.name "radar-publico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-publica/
          git diff --cached --quiet || git commit -m "diários oficiais: caso ${{ inputs.caso }}"
          git pull --rebase -q
          git push
