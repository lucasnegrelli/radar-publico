name: PNCP em massa
on:
  workflow_dispatch:
    inputs:
      de:
        description: "Mês inicial (AAAA-MM)"
        default: "2026-08"
      ate:
        description: "Mês final (AAAA-MM)"
        default: "2026-10"

jobs:
  planejar:
    runs-on: ubuntu-latest
    outputs:
      janelas: ${{ steps.p.outputs.janelas }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install huggingface_hub
      - id: p
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          DE="${{ inputs.de }}"; ATE="${{ inputs.ate }}"
          if [ -z "$DE" ]; then DE=$(date -u -d "2 months ago" +%Y-%m); ATE=$(date -u +%Y-%m); fi
          python ingestao/pncp_pendentes.py "$DE" "$ATE" | tee -a "$GITHUB_OUTPUT"

  baixar:
    needs: planejar
    if: needs.planejar.outputs.janelas != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        janela: ${{ fromJSON(needs.planejar.outputs.janelas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install duckdb huggingface_hub
      - name: Baixar janela do PNCP
        run: python -I ingestao/pncp_janela.py "${{ matrix.janela }}"
      - name: Enviar ao Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -I ingestao/sync_hf.py subir dados/pncp pncp
